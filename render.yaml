services:
  - type: web
    name: sst-dashboard-v5
    env: python
    region: oregon
    plan: free
    buildCommand: |
      pip install -r requirements.txt &&
      python prepare_data.py --skip-download
    startCommand: gunicorn app:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.12"
      - key: AUTO_PREPARE_DATA
        value: "1"
      - key: SKIP_DOWNLOAD
        value: "1"
    disk:
      name: sst-data
      mountPath: /opt/render/project/src/data
      sizeGB: 5
