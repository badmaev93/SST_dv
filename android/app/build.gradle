plugins {
    id 'com.android.application'
}

android {
    namespace 'kz.hlab.era5dv'
    compileSdk 36

    defaultConfig {
        applicationId "kz.hlab.era5dv"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
